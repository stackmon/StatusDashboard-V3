name: Publish CH production site to OBS

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-obs-prod-ch
  cancel-in-progress: false

env:
  SD_NAME: ${{ vars.SD_NAME_CH }}
  SD_APP_NAME: ${{ vars.SD_APP_NAME_CH }}
  SD_BACKEND_URL: ${{ vars.SD_BACKEND_URL_CH_PROD }}
  SD_CLIENT_ID: ${{ vars.SD_CLIENT_ID_PROD }}
  SD_AUTHORITY_URL: ${{ vars.SD_AUTHORITY_URL_PROD }}
  SD_PROJECT_ID: ${{ vars.SD_PROJECT_ID_PROD }}
  SD_GIT_SHA: ${{ github.sha }}
  OBS_PRIMARY_SITE_ENDPOINT: status-ch.obs-website.eu-ch2.sc.otc.t-systems.com
  RETAIN_DAYS: "30"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
          cache: "pnpm"
          registry-url: "https://artifactory.devops.telekom.de/artifactory/api/npm/one-design-system-npm/"
          scope: "@telekom-ods"

      - name: Configure npm auth
        run: npm config set //artifactory.devops.telekom.de/artifactory/api/npm/one-design-system-npm/:_authToken=${{ secrets.NPM_AUTH_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Write release marker
        run: bash .github/scripts/write-version-json.sh > version.json

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist
            version.json
          retention-days: 7

  publish-primary:
    needs: build
    runs-on: ubuntu-latest

    env:
      OBS_BUCKET: status-ch
      OBS_ENDPOINT: https://obs.eu-ch2.sc.otc.t-systems.com
      OBS_REGION: eu-ch2
      VERSION_FILE: version.json
      AWS_ACCESS_KEY_ID: ${{ secrets.OBS_PROD_EU_CH2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OBS_PROD_EU_CH2_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: .

      - name: Upload to primary bucket
        run: |
          export OBS_SITE_ENDPOINT="$OBS_PRIMARY_SITE_ENDPOINT"
          bash .github/scripts/upload-to-obs.sh
