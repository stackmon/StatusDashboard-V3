server {
    listen 80 default_server;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # Host and SNI both come from the proxy_pass host, and Host is what OBS selects the bucket by.
    proxy_http_version 1.1;
    proxy_ssl_server_name on;

    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;

    # Generated at build time, see the Dockerfile. Failover happens on 502/504 only and
    # proxy_intercept_errors stays off, so each bucket keeps its own status and body: deep links
    # depend on the bucket's error document serving index.html.
    include /etc/nginx/sd3-origins.conf;
}
