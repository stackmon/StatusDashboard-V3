server {
    listen 80 default_server;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # Host and SNI both come from the proxy_pass host, and Host is what OBS selects the bucket by.
    proxy_http_version 1.1;
    proxy_ssl_server_name on;

    # A dead endpoint has to hand the request to the next one quickly; the site is static, so a slow
    # origin never means a slow file.
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;

    # Chain generated at image build time, see Dockerfile. Failover happens on 502/504 only and
    # proxy_intercept_errors stays off, so the responses of the buckets keep their own status and
    # body: deep links depend on the bucket's error document serving index.html.
    include /etc/nginx/sd3-origins.conf;
}
